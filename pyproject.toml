[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-readiness-scorecard"
version = "0.2.0"
description = "Scores a New Relic account's AI readiness across 15 dimensions, via NerdGraph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/acidbathory/ai-readiness-scorecard"
Issues = "https://github.com/acidbathory/ai-readiness-scorecard/issues"

[project.scripts]
ai-readiness = "ai_readiness.cli:main"

[tool.setuptools.packages.find]
include = ["ai_readiness*"]
